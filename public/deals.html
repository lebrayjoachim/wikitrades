<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bons plans — WikiTrade</title>
  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/deals.css">
</head>
<body>
  <header>
    <h1>Bons plans enchères</h1>
    <a class="back" href="/">← Retour</a>
  </header>

  <div class="controls">
    <label class="pages-label">
      Depuis page
      <input type="number" id="from-input" value="1" min="1" max="100">
    </label>
    <label class="pages-label">
      Nb pages
      <input type="number" id="pages-input" value="1" min="1" max="20">
    </label>
    <input type="text" id="q-input" placeholder="Mot-clé (ex: eche)">
    <button id="warmup-btn">Préchauffer</button>
    <button id="search-btn">Chercher</button>
    <button id="sort-btn">Trier par économie</button>
    <span id="status"></span>
  </div>

  <div id="err"></div>

  <table id="table" style="display:none">
    <thead><tr>
      <th>Rareté</th>
      <th>Carte</th>
      <th>Vendeur</th>
      <th>Prix enchère</th>
      <th>Prix marché</th>
      <th>Économie</th>
      <th>% du marché</th>
      <th>Fin dans</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <div id="placeholder">Lance une recherche pour trouver les bons plans.</div>

  <script src="/js/shared.js"></script>
  <script src="/js/deals.js"></script>
</body>
</html>
